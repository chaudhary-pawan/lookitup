
services:
  # ── Redis (Celery message broker) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .           # project root — so `backend/` package is importable
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - insightface_models:/root/.insightface   # share downloaded model weights
    depends_on:
      - redis
    command: >
      uvicorn backend.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backend:/app/backend
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - insightface_models:/root/.insightface
    depends_on:
      - redis
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=1

  # ── Frontend (Vite dev server) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      - PROXY_TARGET=http://api:8000

# Named volume so the InsightFace model (~200MB) is downloaded once
# and shared between api + celery_worker containers
volumes:
  insightface_models:
